<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Produtos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-boxes me-2 text-primary"></i>Produtos
        </h2>
        <button class="btn btn-primary" type="button" id="btn-novo-produto">
            <i class="bi bi-plus-lg"></i> Novo produto
        </button>
    </div>

    <div class="alert alert-danger" id="produto-erro" role="alert" style="display: none;"></div>

    <!-- Formulário de cadastro/edição (o backend só aceita alterações de ADMIN e GERENTE) -->
    <div class="card shadow-sm mb-4" id="produto-form-card" style="display: none; max-width: 600px;">
        <div class="card-body p-4">
            <h5 class="fw-bold mb-3" id="produto-form-titulo">Novo produto</h5>
            <form id="produtoForm">
                <input type="hidden" id="produtoId">

                <div class="mb-3">
                    <label for="nome" class="form-label fw-medium">Nome</label>
                    <input type="text" id="nome" class="form-control" maxlength="100" required>
                </div>

                <div class="mb-3">
                    <label for="tipo" class="form-label fw-medium">Tipo</label>
                    <select id="tipo" class="form-select" required>
                        <option value="" disabled selected>Selecione o tipo</option>
                        <option value="Pizza">Pizza</option>
                        <option value="Lanche">Lanche</option>
                        <option value="Bebida">Bebida</option>
                        <option value="Porção">Porção</option>
                        <option value="Adicional">Adicional</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="preco" class="form-label fw-medium">Preço (R$)</label>
                    <input type="number" id="preco" class="form-control" step="0.01" min="0.01" required>
                </div>

                <div class="form-check mb-3">
                    <input type="checkbox" id="ativo" class="form-check-input" checked>
                    <label for="ativo" class="form-check-label">Produto ativo</label>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-outline-secondary" id="btn-cancelar-produto">Cancelar</button>
                    <button type="submit" class="btn btn-success">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Listagem -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Nome</th>
                        <th>Tipo</th>
                        <th>Preço</th>
                        <th>Ativo</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="5" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum produto cadastrado.
                        </td>
                    </tr>
                    <tr th:each="produto : ${produtos}"
                        th:attr="data-id=${produto.id}, data-nome=${produto.nome}, data-tipo=${produto.tipo}, data-preco=${produto.preco}, data-ativo=${produto.ativo}">
                        <td class="ps-4" th:text="${produto.nome}"></td>
                        <td th:text="${produto.tipo}"></td>
                        <td th:text="${'R$ ' + #numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}"></td>
                        <td>
                            <span class="badge" th:classappend="${produto.ativo} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${produto.ativo} ? 'Sim' : 'Não'"></span>
                        </td>
                        <td class="text-end pe-4">
                            <button type="button" class="btn btn-sm btn-outline-primary me-1 btn-editar-produto">
                                <i class="bi bi-pencil-fill"></i> Editar
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-danger btn-excluir-produto">
                                <i class="bi bi-trash-fill"></i> Excluir
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        (function () {
            const API_PRODUTOS = '/api/produtos';
            const card = document.getElementById('produto-form-card');
            const form = document.getElementById('produtoForm');
            const erroBox = document.getElementById('produto-erro');

            function mostrarErro(mensagem) {
                erroBox.textContent = mensagem;
                erroBox.style.display = mensagem ? 'block' : 'none';
            }

            function abrirFormulario(produto) {
                mostrarErro('');
                document.getElementById('produto-form-titulo').textContent =
                    produto ? 'Editar produto' : 'Novo produto';
                document.getElementById('produtoId').value = produto ? produto.id : '';
                document.getElementById('nome').value = produto ? produto.nome : '';
                document.getElementById('tipo').value = produto ? produto.tipo : '';
                document.getElementById('preco').value = produto ? produto.preco : '';
                document.getElementById('ativo').checked = produto ? produto.ativo === 'true' : true;
                card.style.display = 'block';
                document.getElementById('nome').focus();
            }

            function fecharFormulario() {
                form.reset();
                card.style.display = 'none';
            }

            document.getElementById('btn-novo-produto').addEventListener('click', () => abrirFormulario(null));
            document.getElementById('btn-cancelar-produto').addEventListener('click', fecharFormulario);

            document.querySelectorAll('.btn-editar-produto').forEach(botao => {
                botao.addEventListener('click', () => {
                    const linha = botao.closest('tr');
                    abrirFormulario({
                        id: linha.dataset.id,
                        nome: linha.dataset.nome,
                        tipo: linha.dataset.tipo,
                        preco: linha.dataset.preco,
                        ativo: linha.dataset.ativo
                    });
                });
            });

            document.querySelectorAll('.btn-excluir-produto').forEach(botao => {
                botao.addEventListener('click', async () => {
                    const linha = botao.closest('tr');
                    if (!confirm('Tem certeza que deseja excluir o produto "' + linha.dataset.nome + '"?')) {
                        return;
                    }
                    const response = await fetch(`${API_PRODUTOS}/${linha.dataset.id}`, {
                        method: 'DELETE',
                        headers: csrfHeaders()
                    });
                    if (response.ok) {
                        window.location.reload();
                    } else if (!acessoNegado(response)) {
                        const corpo = await response.json().catch(() => ({}));
                        mostrarErro(corpo.erro || 'Erro ao excluir o produto.');
                    }
                });
            });

            form.addEventListener('submit', async (evento) => {
                evento.preventDefault();
                mostrarErro('');

                const id = document.getElementById('produtoId').value;
                const dados = {
                    nome: document.getElementById('nome').value,
                    tipo: document.getElementById('tipo').value,
                    preco: parseFloat(document.getElementById('preco').value),
                    ativo: document.getElementById('ativo').checked
                };

                const response = await fetch(id ? `${API_PRODUTOS}/${id}` : API_PRODUTOS, {
                    method: id ? 'PUT' : 'POST',
                    headers: csrfHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify(dados)
                });

                if (response.ok) {
                    window.location.reload();
                } else if (!acessoNegado(response)) {
                    const corpo = await response.json().catch(() => ({}));
                    mostrarErro(corpo.erro || 'Erro ao salvar o produto.');
                }
            });
        })();
    </script>
</div>

</body>
</html>
